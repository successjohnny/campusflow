[tool.mypy]
python_version = "3.12"
files = [
    "campusflow",
    "main.py",
    "storage.py",
    "tickets.py",
]
show_error_codes = true
warn_unused_configs = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "TRY004",  # Preserve existing validation exception behavior
    "UP040",   # Preserve existing TypeAlias declarations
]